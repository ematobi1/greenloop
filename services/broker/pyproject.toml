[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Installs dependencies only. The `app` package runs from this folder (uvicorn and
# pytest both put it on the path), so each service can keep its own `app/`.
[project]
name = "greenloop-broker"
version = "0.1.0"
description = "GreenLoop broker: policy, approvals and ledger in front of MCP."
requires-python = ">=3.12"
dependencies = [
    "greenloop-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "httpx2>=2.13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

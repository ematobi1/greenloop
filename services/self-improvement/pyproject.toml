[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Installs dependencies only. The `app` package runs from this folder (pytest puts
# it on the path), so each service can keep its own `app/`.
[project]
name = "greenloop-self-improvement"
version = "0.1.0"
description = "GreenLoop self-improvement pipeline. Execution disabled by default."
requires-python = ">=3.12"
dependencies = [
    "greenloop-contracts",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

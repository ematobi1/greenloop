# Local development stack. Ports bind to 127.0.0.1 only; override host ports with
# GREENLOOP_DB_PORT, GREENLOOP_ORCHESTRATOR_PORT, GREENLOOP_WEB_PORT. The broker is not
# published: only containers on the compose network (the orchestrator) can reach it.
# Values come from a local .env (gitignored); see .env.example for the names.
#
#   docker compose up -d db                 # Postgres + pgvector only
#   docker compose up -d                    # db, orchestrator, broker, web
#   docker compose --profile tools up -d    # also the GitHub MCP server

# No env_file: compose reads .env only to fill the ${...} values below, and each service
# gets just the variables it needs. The orchestrator never sees the broker's database
# password or the bootstrap superuser's, and the broker never sees the orchestrator's
# secrets (ADR 0009 rule 1).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greenloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-greenloop}
    ports:
      - "127.0.0.1:${GREENLOOP_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      # Its own role (scripts/db-bootstrap.ps1), never the bootstrap superuser (ADR 0009).
      # Not a :? check: compose interpolates every service, and db must start before bootstrap.
      DATABASE_URL: postgresql+psycopg://greenloop_orchestrator:${ORCHESTRATOR_DB_PASSWORD:-}@db:5432/${POSTGRES_DB:-greenloop}
      BROKER_URL: http://broker:8100
      ALLOWED_HOSTS: '["127.0.0.1","localhost","orchestrator"]'
      # Empty: browsers never call the orchestrator. The web server proxies every call
      # over this network and holds the token in an httpOnly cookie (ADR 0010).
      CORS_ORIGINS: '[]'
      BROKER_SERVICE_TOKEN: ${BROKER_SERVICE_TOKEN:-}
      ENVIRONMENT: ${ENVIRONMENT:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GREENLOOP_CHAT_MODEL: ${GREENLOOP_CHAT_MODEL:-}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-}
      AI_CONTEXT_TOKEN_LIMIT: ${AI_CONTEXT_TOKEN_LIMIT:-}
      AI_HISTORY_MESSAGE_LIMIT: ${AI_HISTORY_MESSAGE_LIMIT:-}
      AI_MAX_MESSAGE_CHARS: ${AI_MAX_MESSAGE_CHARS:-}
      AI_MEMORY_RECORD_LIMIT: ${AI_MEMORY_RECORD_LIMIT:-}
      # Memory embeddings from Ollama on the host (ADR 0011). "none" keeps recency retrieval.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GREENLOOP_ORCHESTRATOR_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      # Healthy, not just started: a broker that fails its startup check stops the
      # orchestrator starting too, and `up --wait` reports it.
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  broker:
    build:
      context: .
      dockerfile: services/broker/Dockerfile
    environment:
      # Its own role, with access only to the broker schema (ADR 0009).
      BROKER_DATABASE_URL: postgresql+psycopg://greenloop_broker:${BROKER_DB_PASSWORD:-}@db:5432/${POSTGRES_DB:-greenloop}
      APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: apps/web
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8000
      # The exact origin the browser uses; state-changing requests from any other
      # Origin are refused. Set WEB_ORIGIN in .env if you browse to localhost instead.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:${GREENLOOP_WEB_PORT:-3000}}
    ports:
      - "127.0.0.1:${GREENLOOP_WEB_PORT:-3000}:3000"
    depends_on:
      - orchestrator

  # Official GitHub MCP server. Only the broker talks to it. Read-only until the
  # phase 3 approval flow lands; the broker will then supply a short-lived GitHub
  # App installation token. No key file is mounted into this container.
  github-mcp:
    image: ghcr.io/github/github-mcp-server
    profiles: ["tools"]
    stdin_open: true
    environment:
      GITHUB_TOOLSETS: context,repos,issues,pull_requests
      GITHUB_READ_ONLY: "1"

volumes:
  db-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check packages services
      - run: ruff format --check packages services

  python-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/contracts
          - services/orchestrator
          - services/broker
          - services/self-improvement
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e "packages/contracts[dev]"
          pip install -e "${{ matrix.package }}[dev]"
      - name: Test
        working-directory: ${{ matrix.package }}
        run: python -m pytest -q

  orchestrator-postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: greenloop_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: greenloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenloop_test -d greenloop_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e "packages/contracts[dev]"
          pip install -e "services/orchestrator[dev]"
      - name: Integration tests
        working-directory: services/orchestrator
        env:
          TEST_DATABASE_URL: postgresql+psycopg://greenloop_test:test-only-password@127.0.0.1:5432/greenloop_test
        run: python -m pytest -q tests/integration

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm install -g npm@11.3.0
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate environments
        run: |
          for env in dev prod; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-synthetic
